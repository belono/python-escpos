name: Python package on FreeBSD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Run FreeBSD CI
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Run FreeBSD CI
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          run: |
            pkg install -y cups graphviz enchant

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest tox tox-gh
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Check sorting of imports
        uses: isort/isort-action@master
        with:
          requirementsFiles: "requirements.txt doc/requirements.txt"
          sortPaths: "./doc ./src ./examples ./test ./setup.py"
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E,F,W --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with tox
        run: |
          find /usr/local/lib /usr/lib /lib -name 'libcups.so*' 2>/dev/null
          tox --conf pyproject.toml
        env:
          ESCPOS_CAPABILITIES_FILE: /home/runner/work/python-escpos/python-escpos/capabilities-data/dist/capabilities.json
      - name: Test mypy with tox
        run: |
          tox --conf pyproject.toml -e mypy
        env:
          ESCPOS_CAPABILITIES_FILE: /home/runner/work/python-escpos/python-escpos/capabilities-data/dist/capabilities.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          exclude: "**/.mypy_cache"
          flags: unittests
          name: coverage-tox-${{ matrix.python-version }}
          verbose: true

