# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: Python package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Run FreeBSD CI
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.0"
        usesh: true
        prepare: |
          pkg install -y cups graphviz enchant
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest tox tox-gh
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    # - name: Install tox on FreeBSD
    #   run: |
    #     git clone https://github.com/tox/pyproject.git
    #     cd tox/pyproject
    #     pip install -e .
    - name: Test with tox
      run: |
        tox --conf pyproject.toml
      env:
        ESCPOS_CAPABILITIES_FILE: /home/runner/work/python-escpos/python-escpos/capabilities-data/dist/capabilities.json
